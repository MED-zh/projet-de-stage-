name: CI Laravel + Oracle

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP avec OCI8
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, oci8

      - name: Copier .env
        run: cp .env.example .env

      - name: Config Oracle dans .env
        run: |
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=oracle/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=${{ secrets.ORACLE_HOST }}/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=1521/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=${{ secrets.ORACLE_DB }}/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=${{ secrets.ORACLE_USER }}/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=${{ secrets.ORACLE_PASSWORD }}/' .env

      - name: Installer dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Générer clé Laravel
        run: php artisan key:generate

      # - name: Lancer les tests
      #   run: php artisan test

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-app:latest